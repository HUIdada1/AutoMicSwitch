<!DOCTYPE html>
<html lang="zh-CN" data-theme="__INITIAL_THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoMicSwitch</title>
<style>
/* ---------- 主题令牌 ----------
   data-theme 在页面喂进窗口前就填好了，首帧即正确，不会亮一下再变暗。 */
:root{
  --bg:#F3F5FA;
  --panel:#FFFFFF;
  --sunken:#F7F9FC;
  --line:#E4E8F0;
  --line-2:#EEF1F7;
  --txt:#0E1523;
  --txt2:#546078;
  --txt3:#8892A6;
  --accent:#2F6BFF;
  --accent-2:#0BB6CF;
  --accent-soft:rgba(47,107,255,.08);
  --accent-line:rgba(47,107,255,.24);
  --teal-soft:rgba(11,182,207,.09);
  --teal-line:rgba(11,182,207,.26);
  --ok:#0E9F6E;
  --ok-soft:rgba(14,159,110,.1);
  --warn:#B4720C;
  --warn-soft:rgba(180,114,12,.09);
  --err:#C9433C;
  --err-soft:rgba(201,67,60,.09);
  --glow:rgba(47,107,255,.07);
  --shadow:0 1px 2px rgba(14,21,35,.05);
  --ring:0 0 0 3px rgba(47,107,255,.13);
  --scroll:rgba(14,21,35,.16);
  --scroll-hover:rgba(14,21,35,.3);
  --veil:rgba(10,15,25,.34);
  --seg-on:#FFFFFF;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#080B10;
  --panel:#0E131B;
  --sunken:#0A0E15;
  --line:#1B2330;
  --line-2:#161D28;
  --txt:#E9EFF9;
  --txt2:#96A3B7;
  --txt3:#66738A;
  --accent:#5C9DFF;
  --accent-2:#26D3E8;
  --accent-soft:rgba(92,157,255,.12);
  --accent-line:rgba(92,157,255,.3);
  --teal-soft:rgba(38,211,232,.11);
  --teal-line:rgba(38,211,232,.28);
  --ok:#38C08B;
  --ok-soft:rgba(56,192,139,.12);
  --warn:#E0A94A;
  --warn-soft:rgba(224,169,74,.12);
  --err:#E87575;
  --err-soft:rgba(232,117,117,.12);
  --glow:rgba(92,157,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --ring:0 0 0 3px rgba(92,157,255,.16);
  --scroll:rgba(180,200,230,.18);
  --scroll-hover:rgba(180,200,230,.32);
  --veil:rgba(3,6,11,.62);
  --seg-on:#1C2431;
  color-scheme:dark;
}

:root{
  --sans:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"JetBrains Mono",ui-monospace,monospace;
  --top:54px;
  --r:12px;
  --r-sm:7px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font:12.5px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;display:flex;flex-direction:column;
}
body:focus{outline:none}
body::before{
  content:"";position:fixed;left:0;right:0;top:0;height:240px;z-index:0;pointer-events:none;
  background:radial-gradient(62% 100% at 50% 0,var(--glow),transparent 72%);
}
::selection{background:var(--accent-soft);color:var(--txt)}
button{font-family:inherit}
.spacer{flex:1 1 auto}

/* ---------- 顶栏 ---------- */
.top{
  position:relative;z-index:3;flex:0 0 auto;height:var(--top);
  padding:0 16px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);background:var(--bg);
}
.crumb{
  display:flex;align-items:center;gap:7px;flex:0 0 auto;
  font-size:12px;font-weight:600;letter-spacing:.3px;color:var(--txt2);white-space:nowrap;
}
.crumb::before{
  content:"";width:3px;height:13px;border-radius:2px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));
}
.ver{
  font:500 10px/1 var(--mono);letter-spacing:.2px;color:var(--accent);
  background:var(--accent-soft);border:1px solid var(--accent-line);
  border-radius:999px;padding:3px 7px;cursor:default;flex:0 0 auto;
}
.ver.new{color:var(--warn);background:var(--warn-soft);border-color:rgba(224,169,74,.4);cursor:pointer}
.top .spacer{flex:1 1 auto}

.status{
  display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;
  border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.2px;
  color:var(--ok);background:var(--ok-soft);border:1px solid rgba(14,159,110,.24);
}
:root[data-theme="dark"] .status{border-color:rgba(56,192,139,.28)}
.status i{width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;animation:breathe 2.4s ease-in-out infinite}
.status.warn{color:var(--warn);background:var(--warn-soft);border-color:rgba(224,169,74,.32)}
.status.err{color:var(--err);background:var(--err-soft);border-color:rgba(232,117,117,.32)}
.status.err i{animation:none}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.28}}

.facts{display:flex;align-items:center;gap:14px}
.fact{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.fact em{font-style:normal;font-size:10px;letter-spacing:.4px;color:var(--txt3)}
.fact b{font:600 11px/1 var(--mono);color:var(--txt2);font-variant-numeric:tabular-nums}

.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--sunken);border:1px solid var(--line)}
.seg button{
  width:27px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--txt3);
  cursor:pointer;display:grid;place-items:center;transition:color .16s,background .16s;
}
.seg button:hover{color:var(--txt)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- 主区 ---------- */
.scroll{position:relative;z-index:2;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scrollbar-color:var(--scroll) transparent;display:flex;flex-direction:column}
.scroll::-webkit-scrollbar,.picks::-webkit-scrollbar,.devlist::-webkit-scrollbar,.logbox::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb,.picks::-webkit-scrollbar-thumb,.devlist::-webkit-scrollbar-thumb,.logbox::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:99px;border:2px solid transparent;background-clip:content-box}
.scroll::-webkit-scrollbar-thumb:hover,.picks::-webkit-scrollbar-thumb:hover,.devlist::-webkit-scrollbar-thumb:hover,.logbox::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover);background-clip:content-box}
.scroll::-webkit-scrollbar-track,.picks::-webkit-scrollbar-track,.devlist::-webkit-scrollbar-track,.logbox::-webkit-scrollbar-track{background:transparent}

.wrap{max-width:1120px;width:100%;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1 1 auto}

.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.phead{display:flex;align-items:center;gap:8px;padding:10px 14px 9px;border-bottom:1px solid var(--line-2)}
.phead h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.2px}
.count{font:600 10px/1 var(--mono);color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:5px;padding:2px 5px}
.hint{margin-left:auto;font-size:10.5px;color:var(--txt3);white-space:nowrap}
.saved{font-size:10.5px;color:var(--ok);opacity:0;transition:opacity .25s;white-space:nowrap}
.saved.on{opacity:1}

/* ---------- 当前联动 ---------- */
.now{overflow:hidden}
.now::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2) 58%,transparent 92%)}
.now-top{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr);align-items:center;gap:8px;padding:14px 14px 0}
.dev{
  display:flex;align-items:center;gap:9px;min-width:0;
  padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--sunken);
  transition:border-color .3s,box-shadow .3s,background .2s;
}
.dev.flash{border-color:var(--accent-line);box-shadow:var(--ring)}
.dev .ic{
  width:28px;height:28px;flex:0 0 auto;border-radius:7px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);
}
.dev.in .ic{background:var(--teal-soft);color:var(--accent-2);border-color:var(--teal-line)}
.dev .txt{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:1px}
.dev .txt em{font-style:normal;font-size:10px;letter-spacing:.4px;color:var(--txt3)}
.dev .txt b{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev .tag{
  flex:0 0 auto;font:500 9.5px/1 var(--mono);padding:3px 5px;border-radius:5px;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);
}
.dev .tag:empty{display:none}
.dev.in .tag{color:var(--accent-2);background:var(--teal-soft);border-color:var(--teal-line)}
.flow{display:grid;place-items:center;color:var(--txt3)}
.flow svg{opacity:.7}

.now-foot{display:flex;align-items:center;gap:8px;min-height:34px;margin:11px 14px 0;padding:8px 0 10px;border-top:1px solid var(--line-2)}
.now-foot .k{font-size:10px;letter-spacing:.5px;color:var(--txt3);flex:0 0 auto}
.now-foot .v{font:500 11px/1.5 var(--mono);color:var(--txt2);min-width:0;max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{
  display:none;flex:0 0 auto;font:500 9.5px/1 var(--mono);padding:3px 5px;border-radius:5px;
  color:var(--warn);background:var(--warn-soft);border:1px solid rgba(224,169,74,.36);
}
.chip.on{display:inline-block}
.stats{display:flex;align-items:center;margin-left:auto;flex:0 0 auto}
.stats span{display:flex;align-items:baseline;gap:5px;padding:0 11px;border-left:1px solid var(--line-2);white-space:nowrap}
.stats span:first-child{border-left:0;padding-left:0}
.stats em{font-style:normal;font-size:10px;color:var(--txt3)}
.stats b{font:600 12px/1 var(--mono);color:var(--txt);font-variant-numeric:tabular-nums}
.stats b.sm{font-size:10.5px;font-weight:500;color:var(--accent);max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}

/* ---------- 双栏 ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:10px;align-items:stretch;flex:1 0 auto}
.panel.rules,.panel.devices{display:flex;flex-direction:column;min-width:0}

/* 配对板 */
.board{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);gap:6px;padding:10px 14px 0}
.bcol{min-width:0}
.bcol h3,.dgroup h3{
  margin:0 0 6px;font-size:10px;font-weight:500;letter-spacing:.4px;color:var(--txt3);
  display:flex;align-items:center;gap:6px;
}
.bcol h3 em{font-style:normal;font-size:9.5px;letter-spacing:0;color:var(--txt3);opacity:.8}
.barrow{display:grid;place-items:center;color:var(--txt3);padding-top:20px}

.picks,.devlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.picks{max-height:172px;overflow:auto}
.picks li,.devlist li{
  display:flex;align-items:center;gap:7px;min-width:0;
  padding:6px 8px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--sunken);
  font-size:11.5px;transition:background .15s,border-color .15s,box-shadow .15s;
}
.picks li{cursor:default}
.picks li.pb{cursor:grab}
.picks li:hover,.devlist li:hover{background:var(--accent-soft);border-color:var(--accent-line)}
.picks li.sel{background:var(--accent-soft);border-color:var(--accent-line);box-shadow:var(--ring)}
.picks li.dragging{opacity:.4;cursor:grabbing}
.picks li.drop{background:var(--accent-soft);border-color:var(--accent);box-shadow:var(--ring)}
.dot{width:5px;height:5px;border-radius:50%;flex:0 0 auto;background:var(--txt3);opacity:.45}
.picks li.sel .dot{background:var(--accent);opacity:1;box-shadow:0 0 6px var(--accent)}
.nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vd{flex:0 0 auto;font:500 9.5px/1 var(--mono);color:var(--txt3)}
.picks li.na,.devlist li.na{cursor:default;color:var(--txt3);font-size:11px}
.picks li.na:hover,.devlist li.na:hover{background:var(--sunken);border-color:var(--line-2)}

/* 规则列表 */
.rlist{padding:10px 14px 0}
.rhead{font-size:10px;letter-spacing:.4px;color:var(--txt3);margin-bottom:6px}
.rlog{flex:1 1 auto;min-height:0;overflow:hidden;padding-bottom:4px}
.rlog .rhead{margin-bottom:4px}
.rl{display:flex;gap:7px;font:10px/1.7 var(--mono);color:var(--txt3);min-width:0}
.rl .t{flex:0 0 auto;font-variant-numeric:tabular-nums;opacity:.85}
.rl .x{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt2)}
.rl.ok .x{color:var(--ok)}
.rl.warn .x{color:var(--warn)}
.rl.err .x{color:var(--err)}
.rrow{
  display:grid;grid-template-columns:minmax(0,1fr) 12px minmax(0,1fr) minmax(82px,.85fr) 22px;
  align-items:center;gap:6px;padding:4px 7px;margin-bottom:4px;
  border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--sunken);
  transition:background .15s,border-color .15s;
}
.rrow:hover{background:var(--accent-soft);border-color:var(--accent-line)}
.rfrom,.rto{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rto{color:var(--accent);font-weight:600}
.rar{color:var(--txt3);font-size:10px;text-align:center}
.rnote{
  width:100%;min-width:0;height:23px;font:11px/1 var(--sans);color:var(--txt);
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 7px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.rnote::placeholder{color:var(--txt3)}
.rnote:focus{border-color:var(--accent);box-shadow:var(--ring)}
.rdel{
  width:21px;height:21px;border-radius:6px;border:1px solid transparent;background:transparent;
  color:var(--txt3);cursor:pointer;font:12px/1 var(--sans);display:grid;place-items:center;
  transition:color .15s,background .15s,border-color .15s;
}
.rdel:hover{color:var(--err);background:var(--err-soft);border-color:rgba(232,117,117,.32)}

.empty{display:flex;align-items:center;justify-content:center;gap:7px;padding:18px 12px;color:var(--txt3);font-size:11.5px;text-align:center}
.empty svg{opacity:.45;flex:0 0 auto}

.fbrow{
  display:flex;align-items:center;gap:7px;margin:9px 14px 12px;margin-top:auto;padding:7px 10px;
  border-radius:var(--r-sm);border:1px dashed rgba(224,169,74,.4);background:var(--warn-soft);
  font-size:11px;color:var(--warn);transition:border-color .15s,box-shadow .15s;
}
.fbrow.drop{border-style:solid;border-color:var(--warn);box-shadow:0 0 0 3px rgba(224,169,74,.14)}
.fb-tag{flex:0 0 auto;font-size:10px;letter-spacing:.4px;opacity:.85}
.fbrow b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.fbclear{
  margin-left:auto;flex:0 0 auto;border:1px solid rgba(224,169,74,.4);background:transparent;color:inherit;
  font:500 10px/1 var(--sans);padding:4px 8px;border-radius:999px;cursor:pointer;transition:background .15s;
}
.fbclear:hover{background:rgba(224,169,74,.16)}
.fbclear.hide{display:none}

/* 设备清单 */
.dgroup{padding:10px 14px 0}
.dgroup + .dgroup{margin-top:2px}
.dgroup:last-child{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding-bottom:12px}
.devlist{max-height:188px;overflow:auto}
.dgroup:last-child .devlist{max-height:none;flex:1 1 auto;min-height:0}
.devlist li{cursor:pointer}
.devlist li.on{background:var(--accent-soft);border-color:var(--accent-line);cursor:default}
.devlist li.on .dot{background:var(--accent);opacity:1;box-shadow:0 0 6px var(--accent)}
.devlist li.on .vd{color:var(--accent)}
.devlist li.na{cursor:default}

/* ---------- 底栏 ---------- */
.bar{
  position:relative;z-index:3;flex:0 0 auto;min-height:50px;padding:8px 16px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  border-top:1px solid var(--line);background:var(--bg);
}
.btn{
  height:28px;padding:0 12px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);font:500 11.5px/1 var(--sans);
  cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
  transition:background .15s,border-color .15s,color .15s,transform .1s;
}
.btn:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.55;cursor:default;transform:none;background:var(--panel);border-color:var(--line);color:var(--txt3)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(47,107,255,.22)}
.btn.primary:hover{background:var(--accent);color:#fff;filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--txt3)}
.btn.ghost:hover{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.icon{width:28px;padding:0;justify-content:center}

.switch{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt2);cursor:pointer;user-select:none;white-space:nowrap}
.switch:hover{color:var(--txt)}
input[type=checkbox]{
  appearance:none;-webkit-appearance:none;margin:0;flex:0 0 auto;
  width:30px;height:17px;border-radius:999px;position:relative;cursor:pointer;outline:none;
  background:var(--sunken);border:1px solid var(--line);transition:background .18s,border-color .18s;
}
input[type=checkbox]::after{
  content:"";position:absolute;top:1px;left:1px;width:13px;height:13px;border-radius:50%;
  background:var(--txt3);transition:transform .18s,background .18s;
}
input[type=checkbox]:checked{background:var(--accent);border-color:transparent}
input[type=checkbox]:checked::after{transform:translateX(13px);background:#fff}
input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.path{
  font:10px/1 var(--mono);color:var(--txt3);max-width:210px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.upd{font-size:11px;color:var(--txt3);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upd.warn{color:var(--warn)}
.upd.err{color:var(--err)}

/* ---------- 断线提示 ---------- */
.banner{
  position:absolute;left:0;right:0;top:0;z-index:4;padding:6px 16px;
  font-size:11.5px;font-weight:500;color:var(--err);background:var(--err-soft);
  border-bottom:1px solid rgba(232,117,117,.24);transform:translateY(-100%);
  transition:transform .24s ease;
}
.banner.on{transform:translateY(var(--top))}

/* ---------- 日志弹窗 ---------- */
.modal{
  position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:28px;
  background:var(--veil);opacity:0;visibility:hidden;transition:opacity .18s ease,visibility .18s ease;
}
.modal.on{opacity:1;visibility:visible}
.sheet{
  width:min(720px,100%);height:min(440px,100%);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 24px 60px rgba(0,0,0,.34);transform:translateY(8px);transition:transform .2s cubic-bezier(.2,.8,.3,1);
}
.modal.on .sheet{transform:none}
.sheet > header{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line)}
.sheet h2{margin:0;font-size:12.5px;font-weight:600}
.sheet h2 em{font-style:normal;font-size:10.5px;font-weight:400;color:var(--txt3);margin-left:6px}
.sheet > header .x{
  width:26px;height:26px;border:1px solid transparent;border-radius:6px;background:transparent;
  color:var(--txt3);cursor:pointer;font:13px/1 var(--sans);display:grid;place-items:center;transition:color .15s,background .15s;
}
.sheet > header .x:hover{color:var(--txt);background:var(--sunken)}
.sheet > footer{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.logbox{
  flex:1 1 auto;overflow:auto;background:var(--sunken);padding:10px 12px;
  font:11px/1.7 var(--mono);
}
.lg{display:flex;gap:9px}
.lg .t{color:var(--txt3);flex:0 0 auto;font-variant-numeric:tabular-nums}
.lg .x{flex:1;white-space:pre-wrap;word-break:break-word;color:var(--txt2)}
.lg.ok .x{color:var(--ok)}
.lg.warn .x{color:var(--warn)}
.lg.err .x{color:var(--err)}

/* ---------- 提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:64px;z-index:30;transform:translate(-50%,10px);
  padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 10px 28px rgba(0,0,0,.2);font-size:11.5px;color:var(--txt);white-space:nowrap;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease,visibility .18s ease;
}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
.toast.bad{color:var(--err);border-color:rgba(232,117,117,.36)}

@media (max-width:900px){
  .facts{display:none}
  .now-foot .v{max-width:220px}
}
@media (max-width:840px){
  .cols{grid-template-columns:1fr}
}
@media (max-width:700px){
  .top{padding:0 12px}
  .wrap{padding:12px}
  .now-top{grid-template-columns:1fr;gap:6px}
  .flow{display:none}
  .stats{display:none}
  .path{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

<header class="top">
  <span class="crumb">音频联动</span>

  <div class="status" id="statePill"><i></i><span id="stateText">连接中</span></div>

  <div class="facts">
    <span class="fact"><em>运行</em><b id="uptime">--:--</b></span>
    <span class="fact"><em>架构</em><b id="arch">--</b></span>
  </div>

  <span class="spacer"></span>

  <span class="ver" id="ver">v2.4.0</span>

  <div class="seg" id="themeSeg" role="group" aria-label="界面主题">
    <button type="button" data-theme-set="auto" aria-pressed="false" title="跟随系统">

        <rect x="1.6" y="2.6" width="12.8" height="8.8" rx="1.6"/><path d="M5.6 14h4.8M8 11.4V14"/>

    </button>
    <button type="button" data-theme-set="light" aria-pressed="false" title="浅色">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="8" cy="8" r="3.1"/>
        <path d="M8 1.3v1.5M8 13.2v1.5M1.3 8h1.5M13.2 8h1.5M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1"/>
      </svg>
    </button>
    <button type="button" data-theme-set="dark" aria-pressed="false" title="深色">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/>
      </svg>
    </button>
  </div>
</header>

<div class="banner" id="banner">界面与控制台断开连接，正在重试</div>

<main class="scroll">
  <div class="wrap">

    <section class="panel now">
      <div class="now-top">
        <div class="dev out" id="pbCard">
          <span class="ic">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9.6h3.2L11.6 6v12l-4.4-3.6H4z"/><path d="M15 9.2a4 4 0 0 1 0 5.6"/>
            </svg>
          </span>
          <span class="txt"><em>播放输出</em><b id="pbName">—</b></span>

        </div>

        <div class="flow" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12h13M12.6 6.8 17.8 12l-5.2 5.2"/>
          </svg>
        </div>

        <div class="dev in" id="micCard">
          <span class="ic">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="3.2" width="6" height="10.2" rx="3"/><path d="M5.8 11.4a6.2 6.2 0 0 0 12.4 0"/><path d="M12 17.6v3.2M8.8 20.8h6.4"/>
            </svg>
          </span>
          <span class="txt"><em>默认麦克风</em><b id="micName">—</b></span>
          <span class="tag" id="micVid">—</span>
        </div>
      </div>

      <div class="now-foot">

        <b class="v" id="matchText">等待首次切换</b>
        <span class="chip" id="fbBadge">兜底</span>
        <div class="stats">
          <span><em>切换</em><b id="switches">0</b></span>
          <span><em>重试</em><b id="retries">0</b></span>
          <span><em>规则</em><b id="ruleCount">0</b></span>

    <div class="cols">

      <section class="panel rules">
        <header class="phead">
          <h2>联动规则</h2>
          <span class="count" id="ruleCount2">0</span>
          <span class="saved" id="saveHint">已保存</span>
          <span class="hint">拖拽或点选配对</span>

        <div class="board">
          <div class="bcol">

          </div>
          <div class="bcol">

        <div class="dgroup">
          <h3>播放</h3>
          <ul class="devlist" id="pbList"></ul>
        </div>
        <div class="dgroup">
          <h3>录音</h3>
          <ul class="devlist" id="capList"></ul>

    </div>

</main>

<footer class="bar">
  <button class="btn primary" id="btnToggle">暂停联动</button>
  <label class="switch"><input type="checkbox" id="autoStart"><span>开机自启</span></label>
  <button class="btn" id="btnUpdate">检查更新</button>
  <span class="upd" id="updMsg"></span>
  <span class="spacer"></span>
  <span class="path" id="exePath"></span>
  <button class="btn ghost icon" id="btnDir" title="打开程序目录">

      <path d="M3.5 6.5h5l1.8 2.2h10.2v10.8H3.5z"/>

<div class="modal" id="logModal" role="dialog" aria-modal="true" aria-label="运行日志">
  <div class="sheet">
    <header>
      <h2>运行日志 <em id="logCount">0 条</em></h2>
      <span class="spacer"></span>
      <label class="switch"><input type="checkbox" id="autoScroll" checked><span>自动滚动</span></label>
      <button type="button" class="x" id="logX" title="关闭">✕</button>

<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };
  var root = document.documentElement;
  var bridge = window.chrome && window.chrome.webview;

  var seq = 0;
  var pending = {};
  var lastTick = -1;
  var booted = false;
  var guard = false;
  var connected = true;
  var lastUpdate = {};
  var lastTheme = "";
  var pollTimer = null;
  var logOpen = false;
  var lastLogKey = "";

  // 规则以本地这份为准，服务端那份只用来对表
  var state = { rules: [], pb: [], cap: [], fallback: "" };
  var lastServerSig = "";
  var localSig = "";
  var rulesRendered = false;
  var boardSig = "";
  var devSig = "";
  var selKey = null;
  var drag = null;
  var noteTimer = null;

  /* ---------- 与 C# 的通道 ----------
     请求 {i,p,a,v,dv,tx}，回应 {i,d:<状态>}，另有 {e:...} 主动推送。 */
  function call(path, payload){
    return new Promise(function(resolve){
      if(!bridge){ resolve(null); return; }
      var id = String(++seq);
      pending[id] = resolve;
      var msg = {i:id, p:path};
      if(payload){
        for(var k in payload){
          if(Object.prototype.hasOwnProperty.call(payload, k)) msg[k] = payload[k];
        }
      }
      bridge.postMessage(JSON.stringify(msg));
    });
  }

  if(bridge){
    bridge.addEventListener("message", function(ev){
      var m;
      try { m = JSON.parse(ev.data); } catch(e){ return; }
      if(!m) return;

      if(m.e){
        if(m.e === "wake"){ startPolling(); tick(); }
        else if(m.e === "theme"){ tick(); }
        return;
      }
      var fn = pending[m.i];
      if(fn){ delete pending[m.i]; fn(m.d); }
    });
  }

  /* ---------- 小工具 ---------- */
  function fmtUptime(s){
    s = Math.max(0, parseInt(s, 10) || 0);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    var p = function(n){ return (n < 10 ? "0" : "") + n; };
    return (h > 0 ? h + ":" : "") + p(m) + ":" + p(x);
  }
  function esc(t){
    return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }
  function setText(id, v){
    var el = $(id);
    if(el && el.textContent !== v) el.textContent = v;
  }
  function setTitle(id, v){
    var el = $(id);
    if(el && el.title !== v) el.title = v;
  }
  function flash(el){
    if(!el) return;
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
    setTimeout(function(){ el.classList.remove("flash"); }, 700);
  }
  function toast(text, bad){
    var t = $("toast");
    t.textContent = text;
    t.className = "toast on" + (bad ? " bad" : "");
    clearTimeout(t._h);
    t._h = setTimeout(function(){ t.className = "toast" + (bad ? " bad" : ""); }, 2200);
  }

  /* ---------- 主题 ---------- */
  function applyTheme(pref, dark){
    var want = dark ? "dark" : "light";
    if(root.getAttribute("data-theme") !== want) root.setAttribute("data-theme", want);
    if(lastTheme === pref) return;
    lastTheme = pref;

    var btns = $("themeSeg").getElementsByTagName("button");
    for(var i = 0; i < btns.length; i++){
      var on = btns[i].getAttribute("data-theme-set") === pref;
      btns[i].setAttribute("aria-pressed", on ? "true" : "false");
    }
  }

  $("themeSeg").addEventListener("click", function(e){
    var seg = $("themeSeg"), t = e.target;
    while(t && t !== seg && t.tagName !== "BUTTON") t = t.parentNode;
    if(!t || t === seg) return;
    var pref = t.getAttribute("data-theme-set");
    if(!pref || pref === lastTheme) return;
    root.setAttribute("data-theme", pref === "dark" ? "dark"
      : pref === "light" ? "light"
      : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    act("settheme", undefined, undefined, pref);
  });

  /* ---------- 设备键 ----------
     规则按 InstanceId 做包含匹配。VID 换口、改名、重装驱动都不变，优先用它；
     少数虚拟设备没有 VID，退回整段端点 ID。 */
  function devKey(d){
    var vid = d.vid && d.vid !== "-" ? d.vid : "";
    return vid || d.id || "";
  }
  function allDevices(){ return state.pb.concat(state.cap); }

  // 没有 VID 的端点用「—」占位，别在界面上显示一个孤零零的短横
  function vidText(v){ return (!v || v === "-") ? "—" : v; }
  function tagText(v){ return (!v || v === "-") ? "" : v; }
  function nameOf(key){
    if(!key) return "—";
    var list = allDevices(), i;
    for(i = 0; i < list.length; i++){
      if(devKey(list[i]) === key) return list[i].name;
    }
    for(i = 0; i < list.length; i++){
      var k = devKey(list[i]);
      if(k && (k.toLowerCase().indexOf(String(key).toLowerCase()) >= 0
             || String(key).toLowerCase().indexOf(k.toLowerCase()) >= 0)) return list[i].name;
    }
    return key;
  }

  /* ---------- 渲染 ---------- */
  function render(d){
    setConn(true);

    setText("ver", "v" + d.version);
    setText("uptime", fmtUptime(d.uptime));
    setText("arch", d.arch || "--");

    $("statePill").className = "status" + (d.paused ? " warn" : "");
    setText("stateText", d.paused ? "已暂停" : "运行中");

    var pb = d.playback || {}, mic = d.mic || {};
    setText("pbName", pb.name || "—");
    setText("pbVid", tagText(pb.vid));
    setText("micName", mic.name || "—");
    setText("micVid", tagText(mic.vid));
    setTitle("pbName", pb.name || "");
    setTitle("micName", mic.name || "");

    setText("matchText", d.matchedText || "—");
    setTitle("matchText", d.matchedText || "");
    $("fbBadge").className = "chip" + (d.isFallback ? " on" : "");

    setText("switches", String(d.switches));
    setText("retries", String(d.retries));
    setText("fallbackKey", d.fallback ? nameOf(d.fallback) : "未设置");
    setTitle("fallbackKey", d.fallback || "");

    setText("fbKey", d.fallback ? nameOf(d.fallback) : "未设置，未命中时保持不变");
    setTitle("fbKey", d.fallback || "");
    $("fbClear").className = "fbclear" + (d.fallback ? "" : " hide");

    setText("exePath", d.exePath || "");
    setTitle("exePath", d.exePath || "");
    setText("btnToggle", d.paused ? "恢复联动" : "暂停联动");

    applyTheme(d.theme || "auto", !!d.themeDark);
    renderUpdate(d.update);

    guard = true;
    $("autoStart").checked = !!d.autostart;
    guard = false;

    state.pb = d.devicesPlayback || [];
    state.cap = d.devicesCapture || [];
    state.fallback = d.fallback || "";

    // 规则只在服务端那份真的变了、且不是刚存的那份时覆盖本地，
    // 否则正在输入说明的那一格会被重画，光标就飞了。
    var sig = rulesSig(d.rules);
    if(!rulesRendered || (sig !== localSig && sig !== lastServerSig)){
      rulesRendered = true;
      lastServerSig = sig;
      state.rules = (d.rules || []).map(function(r){
        return {p:r.playback, m:r.mic, n:r.note || ""};
      });
      renderRules();
    } else {
      lastServerSig = sig;
    }

    renderBoard();
    renderDevices();
    renderRecent(d.recent || []);

    var ev = d.lastEvent || {};
    if(booted && ev.tick !== lastTick){
      flash($("pbCard"));
      flash($("micCard"));
    }
    lastTick = ev.tick;
    booted = true;
  }

  function rulesSig(list){
    list = list || [];
    var out = [];
    for(var i = 0; i < list.length; i++){
      var r = list[i];
      out.push((r.playback !== undefined ? r.playback : r.p) + "\t"
             + (r.mic !== undefined ? r.mic : r.m) + "\t"
             + (r.note !== undefined ? r.note : (r.n || "")));
    }
    return out.join("\n");
  }

  /* ---------- 配对板 ---------- */
  function pickItem(d, kind){
    var key = devKey(d);
    var hint = kind === "pb" ? "拖到右边麦克风上，或点一下再点右边" : "把左边的播放设备拖到这里";
    return '<li class="' + (kind === "pb" ? "pb" : "") + '" data-key="' + esc(key) + '"'
         + (kind === "pb" ? ' draggable="true"' : "")
         + ' title="' + esc(d.name + "\n" + (d.vid || "") + "\n" + hint) + '">'
         + '<span class="dot"></span><span class="nm">' + esc(d.name) + '</span>'
         + '<span class="vd">' + esc(vidText(d.vid)) + '</span></li>';
  }

  function listSig(arr){
    var out = [];
    for(var i = 0; i < arr.length; i++) out.push(devKey(arr[i]) + "~" + arr[i].name + "~" + arr[i].vid);
    return out.join("|");
  }

  function renderBoard(){
    var sig = listSig(state.pb) + "#" + listSig(state.cap);
    if(sig === boardSig) { applySel(); return; }
    boardSig = sig;

    var pb = state.pb, cap = state.cap, i, h1 = "", h2 = "";
    if(!pb.length) h1 = '<li class="na">没有检测到播放设备</li>';
    for(i = 0; i < pb.length; i++) h1 += pickItem(pb[i], "pb");
    $("pairPb").innerHTML = h1;

    if(!cap.length) h2 = '<li class="na">没有检测到录音设备</li>';
    for(i = 0; i < cap.length; i++) h2 += pickItem(cap[i], "cap");
    $("pairCap").innerHTML = h2;

    applySel();
  }

  function applySel(){
    var items = $("pairPb").getElementsByTagName("li");
    for(var i = 0; i < items.length; i++){
      var on = !!selKey && items[i].getAttribute("data-key") === selKey;
      if(on !== items[i].classList.contains("sel")) items[i].classList.toggle("sel", on);
    }
  }

  function renderRules(){
    var list = state.rules;
    setText("ruleCount", String(list.length));
    setText("ruleCount2", String(list.length));

    if(!list.length){
      $("ruleRows").innerHTML = '<div class="empty">'
        + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">'
        + '<path d="M3 6h18M3 12h11M3 18h7"/><path d="M18 15v6M15 18h6"/></svg>'
        + '<span>还没有规则，把左边的播放设备拖到右边麦克风上</span></div>';
      return;
    }

    var html = "";
    for(var i = 0; i < list.length; i++){
      var r = list[i];
      html += '<div class="rrow" data-i="' + i + '">'
            + '<span class="rfrom" title="' + esc(r.p) + '">' + esc(nameOf(r.p)) + '</span>'
            + '<span class="rar">→</span>'
            + '<span class="rto" title="' + esc(r.m) + '">' + esc(nameOf(r.m)) + '</span>'
            + '<input class="rnote" type="text" maxlength="40" placeholder="说明" value="' + esc(r.n) + '">'
            + '<button type="button" class="rdel" title="删除">✕</button>'
            + '</div>';
    }
    $("ruleRows").innerHTML = html;
  }

  function devSigOf(){
    return state.pb.map(function(x){ return x.id + "~" + x["default"] + "~" + x.name + "~" + x.vid; }).join("|")
         + "#" + state.cap.map(function(x){ return x.id + "~" + x["default"] + "~" + x.name + "~" + x.vid; }).join("|");
  }

  function renderDevices(){
    var sig = devSigOf();
    if(sig === devSig) return;
    devSig = sig;
    $("pbList").innerHTML = devList(state.pb, "render");
    $("capList").innerHTML = devList(state.cap, "capture");
  }

  function devList(arr, kind){
    arr = arr || [];
    if(!arr.length) return '<li class="na"><span class="dot"></span><span class="nm">没有检测到设备</span></li>';
    var html = "";
    for(var i = 0; i < arr.length; i++){
      var x = arr[i];
      html += '<li class="' + (x["default"] ? "on" : "") + '"'
            + ' data-id="' + esc(x.id) + '" data-kind="' + kind + '"'
            + ' title="' + esc(x.name + "\n" + x.vid + "\n" + (x["default"] ? "当前默认设备" : "点一下设为默认")) + '">'
            + '<span class="dot"></span><span class="nm">' + esc(x.name) + '</span>'
            + '<span class="vd">' + esc(vidText(x.vid)) + '</span></li>';
    }
    return html;
  }

  var recentSig = "";
  var recentRendered = false;
  function renderRecent(list){
    var sig = "", i;
    for(i = 0; i < list.length; i++) sig += list[i].t + list[i].text + "|";
    if(recentRendered && sig === recentSig) return;
    recentRendered = true;
    recentSig = sig;

    var html = "";
    if(!list.length) html = '<div class="rl"><span class="t">--:--</span><span class="x">暂无记录</span></div>';
    for(i = 0; i < list.length; i++){
      var l = list[i];
      html += '<div class="rl ' + esc(l.level) + '"><span class="t">' + esc(l.t) + '</span>'
            + '<span class="x" title="' + esc(l.text) + '">' + esc(l.text) + '</span></div>';
    }
    $("recentRows").innerHTML = html;
  }

  function renderLog(logs){
    var key = logs.length + "|" + (logs.length ? logs[logs.length - 1].t + logs[logs.length - 1].text : "");
    if(key === lastLogKey) return;
    lastLogKey = key;

    var box = $("logbox");
    var html = "";
    for(var i = 0; i < logs.length; i++){
      var l = logs[i];
      html += '<div class="lg ' + esc(l.level) + '"><span class="t">' + esc(l.t) + '</span>'
            + '<span class="x">' + esc(l.text) + '</span></div>';
    }
    if(!html) html = '<div class="lg info"><span class="t">--:--:--</span><span class="x">暂无日志</span></div>';
    box.innerHTML = html;
    setText("logCount", logs.length + " 条");
    if($("autoScroll").checked) box.scrollTop = box.scrollHeight;
  }

  function renderUpdate(u){
    lastUpdate = u || {};
    var btn = $("btnUpdate"), msg = $("updMsg"), ver = $("ver");
    var s = lastUpdate.status || "idle";

    btn.disabled = false;
    if(s === "checking"){ btn.textContent = "检查中"; btn.disabled = true; }
    else if(s === "downloading"){ btn.textContent = "下载中 " + (lastUpdate.percent || 0) + "%"; btn.disabled = true; }
    else if(s === "available"){ btn.textContent = "下载 v" + lastUpdate.latest; }
    else if(s === "ready"){ btn.textContent = "重启并更新"; }
    else { btn.textContent = "检查更新"; }

    msg.className = "upd";
    ver.className = "ver";
    ver.title = "";
    if(s === "available"){
      msg.textContent = "发现 v" + lastUpdate.latest;
      msg.className = "upd warn";
      ver.className = "ver new";
      ver.title = lastUpdate.notes ? ("更新说明：\n" + lastUpdate.notes) : "有新版本可用";
    } else if(s === "ready"){
      msg.textContent = "v" + lastUpdate.latest + " 待重启";
      msg.className = "upd warn";
      ver.className = "ver new";
      ver.title = "新版本已下载，重启后生效";
    } else if(s === "error"){
      msg.textContent = lastUpdate.message || "检查更新失败";
      msg.className = "upd err";
    } else if(s === "latest"){
      msg.textContent = "已是最新版本";
    } else {
      msg.textContent = lastUpdate.message || "";
    }
  }

  function setConn(ok){
    if(connected === ok) return;
    connected = ok;
    $("banner").className = "banner" + (ok ? "" : " on");
    if(!ok){
      $("statePill").className = "status err";
      setText("stateText", "连接中断");
    }
  }

  /* ---------- 轮询 ----------
     窗口收进托盘时页面变 hidden，停掉轮询；叫回窗口时 C# 推一条 wake。 */
  function tick(){
    if(document.hidden) return;
    call("/api/status").then(function(d){
      if(d && d.ok){
        render(d);
        if(logOpen) loadLog();
      } else setConn(false);
    }, function(){ setConn(false); });
  }

  function loadLog(){
    call("/api/log").then(function(d){
      if(d && d.ok) renderLog(d.log || []);
    }, function(){});
  }

  function startPolling(){
    if(pollTimer) return;
    pollTimer = setInterval(tick, 1200);
  }
  function stopPolling(){
    if(!pollTimer) return;
    clearInterval(pollTimer);
    pollTimer = null;
  }

  document.addEventListener("visibilitychange", function(){
    if(document.hidden) stopPolling();
    else { startPolling(); tick(); }
  });

  /* ---------- 动作 ---------- */
  function act(action, value, deviceId, text){
    call("/api/action", {a:action, v:value, dv:deviceId, tx:text}).then(function(d){
      if(d && d.ok) render(d);
    }, function(){});
  }

  function saveRules(){
    var lines = [];
    for(var i = 0; i < state.rules.length; i++){
      var r = state.rules[i];
      // 一行一条，三段用制表符隔开；说明里的分隔符先洗掉，别把行拆坏
      lines.push(r.p + "\t" + r.m + "\t" + String(r.n || "").replace(/[\t\r\n]/g, " "));
    }
    localSig = rulesSig(state.rules);
    act("saverules", undefined, undefined, lines.join("\n"));
    var hint = $("saveHint");
    hint.className = "saved on";
    clearTimeout(hint._h);
    hint._h = setTimeout(function(){ hint.className = "saved"; }, 1500);
  }

  // 同一台播放设备只留一条：再配一次就是换目标
  function addRule(p, m){
    if(!p || !m) return;
    for(var i = 0; i < state.rules.length; i++){
      if(state.rules[i].p === p){
        if(state.rules[i].m === m){ toast(nameOf(p) + " 已指向这台麦克风"); return; }
        state.rules[i].m = m;
        renderRules(); saveRules();
        toast("已改为 " + nameOf(m));
        return;
      }
    }
    state.rules.push({p:p, m:m, n:""});
    renderRules(); saveRules();
    toast("已建立 " + nameOf(p) + " → " + nameOf(m));
  }

  function clearDrop(){
    var marked = document.querySelectorAll("ul.picks li.drop");
    for(var i = 0; i < marked.length; i++) marked[i].classList.remove("drop");
    $("fbRow").classList.remove("drop");
  }

  /* ---------- 拖拽 ---------- */
  var pbUl = $("pairPb"), capUl = $("pairCap"), fbRow = $("fbRow");

  pbUl.addEventListener("dragstart", function(e){
    var li = e.target.closest ? e.target.closest("li") : null;
    if(!li || !li.getAttribute("data-key")){ e.preventDefault(); return; }
    drag = {key:li.getAttribute("data-key")};
    li.classList.add("dragging");
    try {
      e.dataTransfer.setData("text/plain", drag.key);
      e.dataTransfer.effectAllowed = "copy";
    } catch(x){}
  });
  pbUl.addEventListener("dragend", function(e){
    var li = e.target.closest ? e.target.closest("li") : null;
    if(li) li.classList.remove("dragging");
    drag = null;
    clearDrop();
  });

  capUl.addEventListener("dragover", function(e){
    if(!drag) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = "copy"; } catch(x){}
    var li = e.target.closest ? e.target.closest("li") : null;
    clearDrop();
    if(li && li.getAttribute("data-key")) li.classList.add("drop");
  });
  capUl.addEventListener("dragleave", function(e){
    if(!capUl.contains(e.relatedTarget)) clearDrop();
  });
  capUl.addEventListener("drop", function(e){
    e.preventDefault();
    var li = e.target.closest ? e.target.closest("li") : null;
    var m = li ? li.getAttribute("data-key") : "";
    clearDrop();
    if(drag && m){ addRule(drag.key, m); drag = null; }
  });

  fbRow.addEventListener("dragover", function(e){
    if(!drag) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = "copy"; } catch(x){}
    clearDrop();
    fbRow.classList.add("drop");
  });
  fbRow.addEventListener("dragleave", function(){ fbRow.classList.remove("drop"); });
  fbRow.addEventListener("drop", function(e){
    e.preventDefault();
    fbRow.classList.remove("drop");
    if(!drag) return;
    var key = drag.key;
    drag = null;
    act("setfallback", undefined, undefined, key);
    toast("兜底已设为 " + nameOf(key));
  });

  /* ---------- 点选配对 ---------- */
  pbUl.addEventListener("click", function(e){
    var li = e.target.closest ? e.target.closest("li") : null;
    if(!li || !li.getAttribute("data-key")) return;
    var key = li.getAttribute("data-key");
    if(selKey === key){ selKey = null; }
    else { selKey = key; toast("已选中 " + nameOf(key) + "，再点右边一台麦克风"); }
    applySel();
  });

  capUl.addEventListener("click", function(e){
    var li = e.target.closest ? e.target.closest("li") : null;
    if(!li || !li.getAttribute("data-key")) return;
    if(!selKey){ toast("先点左边的播放设备", true); return; }
    addRule(selKey, li.getAttribute("data-key"));
    selKey = null;
    applySel();
  });

  /* ---------- 规则行 ---------- */
  $("ruleRows").addEventListener("click", function(e){
    if(!e.target.closest || !e.target.closest(".rdel")) return;
    var row = e.target.closest(".rrow");
    if(!row) return;
    var i = parseInt(row.getAttribute("data-i"), 10);
    if(isNaN(i) || !state.rules[i]) return;
    var gone = state.rules[i];
    state.rules.splice(i, 1);
    renderRules(); saveRules();
    toast("已删除 " + nameOf(gone.p) + " → " + nameOf(gone.m));
  });

  $("ruleRows").addEventListener("input", function(e){
    if(e.target.className !== "rnote") return;
    var row = e.target.closest(".rrow");
    if(!row) return;
    var i = parseInt(row.getAttribute("data-i"), 10);
    if(isNaN(i) || !state.rules[i]) return;
    state.rules[i].n = e.target.value;
    // 边打字边存会把磁盘敲烂，停手半秒再落盘
    clearTimeout(noteTimer);
    noteTimer = setTimeout(saveRules, 600);
  });

  $("fbClear").onclick = function(){
    act("setfallback", undefined, undefined, "");
    toast("已清除兜底");
  };

  /* ---------- 日志 ---------- */
  function openLog(){
    logOpen = true;
    lastLogKey = "";
    $("logModal").className = "modal on";
    tick();
    loadLog();
  }
  function closeLog(){
    logOpen = false;
    $("logModal").className = "modal";
  }
  $("btnLog").onclick = openLog;
  $("logX").onclick = closeLog;
  $("logClose").onclick = closeLog;
  $("logModal").addEventListener("click", function(e){
    if(e.target === $("logModal")) closeLog();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && logOpen) closeLog();
  });
  $("btnOpenLogFile").onclick = function(){ act("openlog"); };

  /* ---------- 其余按钮 ---------- */
  $("btnToggle").onclick = function(){ act("toggle"); };
  $("btnDir").onclick = function(){ act("opendir"); };

  function onDevClick(e){
    var li = e.target.closest ? e.target.closest("li") : null;
    if(!li || li.classList.contains("on") || li.classList.contains("na")) return;
    var id = li.getAttribute("data-id");
    if(!id) return;
    act(li.getAttribute("data-kind") === "render" ? "setplayback" : "setcapture", undefined, id);
  }
  $("pbList").addEventListener("click", onDevClick);
  $("capList").addEventListener("click", onDevClick);

  $("btnUpdate").onclick = function(){
    var s = lastUpdate.status || "idle";
    if(s === "available") act("downloadupdate");
    else if(s === "ready"){
      if(confirm("现在重启并更新？程序会退出，装好后自动启动。")) act("applyupdate");
    }
    else act("checkupdate");
  };
  $("ver").onclick = function(){
    if(lastUpdate.status === "available" || lastUpdate.status === "ready") act("openreleases");
  };
  $("autoStart").onchange = function(){
    if(guard) return;
    act("autostart", this.checked);
  };

  tick();
  startPolling();

  // 窗口打开时 WebView2 会把焦点丢到第一个按钮上，焦点框跟着亮一下。
  // 先把焦点收到 body，键盘用户按 Tab 时该有的焦点提示仍然在。
  document.body.tabIndex = -1;
  document.body.focus();
  var pointerUsed = false;
  document.addEventListener("pointerdown", function(){ pointerUsed = true; }, true);
  function dropStrayFocus(){
    if(pointerUsed) return;
    var a = document.activeElement;
    if(a && a.tagName === "BUTTON"){ a.blur(); document.body.focus(); }
  }
  setTimeout(dropStrayFocus, 300);
  setTimeout(dropStrayFocus, 1200);
})();
</script>
</body>
</html>
